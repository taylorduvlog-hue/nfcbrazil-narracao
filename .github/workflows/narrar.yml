name: Narrar

# Chamado pelo n8n. Gera o MP3 + SRT com o narrar.py, guarda em audios/
# e devolve o resultado (JSON com os links) para o n8n pelo resume_url.
on:
  workflow_dispatch:
    inputs:
      pedido:
        description: "Identificador do pedido (vira parte do nome do arquivo)"
        required: true
      texto_b64:
        description: "Texto da narracao em base64 (UTF-8)"
        required: true
      voz:
        description: "francisca, antonio, thalita ou nome completo"
        required: false
        default: "francisca"
      velocidade:
        required: false
        default: "+10%"
      tom:
        required: false
        default: "+0Hz"
      resume_url:
        description: "URL do no Wait do n8n que recebe o resultado"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: narrar-push
  cancel-in-progress: false

jobs:
  narrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A URL de retorno e lida do evento (nunca aparece no log) e mascarada.
      - name: Esconder a URL de retorno dos logs
        run: |
          URL=$(jq -r '.inputs.resume_url // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$URL" ]; then
            echo "::add-mask::$URL"
            echo "RESUME_URL=$URL" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar narradores (Edge, Piper, Google)
        run: |
          pip install -r requirements.txt
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Voz offline do Piper (guardada em cache)
        uses: actions/cache@v4
        with:
          path: vozes_piper
          key: piper-pt_BR-faber-medium

      - name: Gerar narracao
        id: narrar
        env:
          PEDIDO: ${{ inputs.pedido }}
          TEXTO_B64: ${{ inputs.texto_b64 }}
          VOZ: ${{ inputs.voz }}
          VELOCIDADE: ${{ inputs.velocidade }}
          TOM: ${{ inputs.tom }}
        run: |
          set +e
          PASTA="audios/$(date -u +%Y-%m)"
          python narrar.py --texto-b64 "$TEXTO_B64" --nome "$PEDIDO" \
            --voz "$VOZ" --velocidade="$VELOCIDADE" --tom="$TOM" \
            --pasta-saida "$PASTA" > resultado_local.json
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          cat resultado_local.json

      # Salva o audio e o estado dos narradores (quem anda falhando), mesmo se tudo falhar
      - name: Salvar audio no repositorio
        if: always()
        env:
          PEDIDO: ${{ inputs.pedido }}
        run: |
          git config user.name "nfcbrazil-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d audios ] && git add audios
          [ -f estado_narradores.json ] && git add estado_narradores.json
          git diff --cached --quiet && exit 0
          git commit -m "narracao: $PEDIDO"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && break
            sleep $((i * 3))
          done

      - name: Montar resposta
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA=$(git rev-parse HEAD)
          BASE="https://raw.githubusercontent.com/$REPO/$SHA"
          python - "$BASE" "$RUN_URL" <<'PY'
          import json, os, sys
          base, run_url = sys.argv[1], sys.argv[2]
          r = json.load(open("resultado_local.json", encoding="utf-8"))
          if r.get("status") == "ok":
              raiz = os.getcwd()
              for campo in ("audio", "legenda"):
                  rel = os.path.relpath(r[campo], raiz).replace(os.sep, "/")
                  r[campo + "_caminho"] = rel
                  r[campo + "_url"] = f"{base}/{rel}"
          r["execucao_github"] = run_url
          json.dump(r, open("resposta.json", "w", encoding="utf-8"), ensure_ascii=True)
          print(json.dumps(r, ensure_ascii=False, indent=2))
          PY

      - name: Avisar o n8n
        if: always() && inputs.resume_url != ''
        run: |
          [ -f resposta.json ] || echo '{"status":"erro","erro":"falha antes de gerar a resposta"}' > resposta.json
          curl -sS --retry 3 --retry-delay 5 -X POST -H "Content-Type: application/json" \
            --data-binary @resposta.json "$RESUME_URL"

      - name: Falhar se a narracao falhou
        if: steps.narrar.outputs.codigo != '0'
        run: exit 1
